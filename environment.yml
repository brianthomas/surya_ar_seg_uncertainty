# Conda environment for surya_ar_seg_uncertainty
#
# Mirrors the dependency set in pyproject.toml. Split follows the sibling
# project ~/Code/surya_workshop/environment.yml: conda-forge supplies the
# scientific stack (and the HDF5/netCDF system libraries underneath it),
# pip supplies torch and the ML-specific packages.
#
#   conda env create -f environment.yml
#   conda activate surya_ar_seg_uncertainty
#   pip install --no-deps -e .          # puts `surya` on the path; see note below
#   python -m ipykernel install --user --name surya_ar_seg_uncertainty
#
# The editable install is a separate step on purpose: a plain `pip install -e .`
# would re-resolve every pyproject dependency from PyPI and fight the
# conda-installed builds below. --no-deps installs only the `surya` package.

name: surya_ar_seg_uncertainty

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # --- data / numerics ---
  - numpy>=1.21
  - pandas>=1.3,<3         # cap is deliberate: repo predates pandas 3.x copy-on-write semantics
  - xarray>=0.20
  - numba>=0.56
  - packaging>=21.0
  - pyyaml>=5.4

  # --- HDF5 + netCDF I/O (masks are .h5, SDO cubes are .nc) ---
  - h5py>=3.0
  - hdf5plugin>=3.0
  - h5netcdf>=1.6.4
  - boto3>=1.34            # S3 data access (sdo_data_root_path may be an s3:// URI)

  # --- imaging / solar physics ---
  - scikit-image>=0.19
  - sunpy>=4.0
  - matplotlib-base>=3.5
  - mpl_animators>=1.2.4   # conda-forge spells this with an underscore (PyPI uses a hyphen)

  # --- training utilities / tooling ---
  - wandb>=0.15
  - tqdm>=4.60
  - pytest>=8.4.1
  - ipykernel>=6.30.1
  - ipywidgets>=7.6.0

  - pip:
      # CUDA-enabled Linux wheels come straight from PyPI. For the exact CUDA
      # 12.6 build that pyproject.toml pins via uv, add as the first pip entry:
      #   - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.9.*
      - torchvision==0.24.*
      - timm>=1.0
      - peft>=0.4
      - einops>=0.4
      - huggingface_hub>=0.10
      - hf_transfer>=0.1.9
