# job_id: large_scale
job_id: AR-segmentation_lora_r32_a64_d0.1
data:
  # Use this to point at the paths of HelioFM data indices
  sdo_data_root_path: s3://nasa-surya-bench
  # --- S3 (only used when sdo_data_root_path is an s3:// URI) ---
  # nasa-surya-bench is public. Left false, the ambient AWS credentials are used to
  # sign the request and the bucket rejects it with 403.
  s3_anon: true
  # Where objects are staged before reading. Each is deleted immediately after use,
  # so peak usage is num_data_workers x world_size x ~0.6 GB, not the dataset size.
  # null -> $SURYA_S3_SCRATCH, $SCRATCH, $TMPDIR, then the system temp dir.
  s3_scratch_dir: null
  s3_boto3_max_concurrency: 4
  s3_boto3_part_size_mb: 64
  train_data_path: ./assets/train_index_surya_1_0.csv
  valid_data_path: ./assets/valid_index_surya_1_0.csv
  channels: ['aia94', 'aia131', 'aia171', 'aia193', 'aia211', 'aia304', 'aia335', 'aia1600', 'hmi_m', 'hmi_bx', 'hmi_by', 'hmi_bz', 'hmi_v']
  time_delta_input_minutes: [0]
  time_delta_target_minutes: +60
  # n_input_timestamps: 1 #Optional integer to randomly sample time_delta_input_minutes
  batch_size: 1
  num_data_workers: 8
  prefetch_factor: 2
  scalers_path: ./assets/scalers.yaml
  #### Put your donwnstream (DS) specific parameters below this line
  # Directory holding the downloaded AR mask .h5 files, i.e. the parent of the
  # dataset's data/ folder. Relative paths resolve against the working directory.
  # null -> ./assets/surya-bench-ar-segmentation (where download_data.sh puts them).
  ar_mask_root_path: "/home/jovyan/scratch_space/AR_Seg_Uncertainty/data/masks"
  ar_index_train: ["./assets/surya-bench-ar-segmentation/train.csv"]
  ar_index_valid: ["./assets/surya-bench-ar-segmentation/validation.csv"]
  ar_index_test: ["./assets/surya-bench-ar-segmentation/test.csv"]
model:
  model_type: spectformer_lora # Options: unet, spectformer_lora,
  # Spectformer options
  img_size: 4096
  patch_size: 16
  in_channels: 13
  time_embedding:
    type: linear           # Options: linear, perceiver
    n_queries: null        # Integer for perceiver; otherwise null
    time_dim: 1            # Integer
  embed_dim: 1280
  depth: 10
  spectral_blocks: 2
  num_heads: 16
  mlp_ratio: 4.0
  rpe: false
  drop_rate: 0.0
  window_size: 2
  dp_rank: 4
  learned_flow: false
  epochs_to_learn_flow: 0 # Start by training flow model only before freezing
  init_weights: false
  checkpoint_layers: []
  ensemble: null # Set to integer or null
  unet_embed_dim: 128 # For unet
  unet_blocks: 3 # For unet
  finetune: True
  # Finetuning config fields
  ft_unembedding_type: "linear" # "linear" or "perceiver"
  ft_out_chans: 1
  use_lora: true
  lora_config:
    r: 32  # LoRA rank
    lora_alpha: 64  # LoRA alpha parameter
    #target_modules: ['q_proj', 'v_proj', 'k_proj', 'out_proj', 'fc1', 'fc2']  # Target modules for LoRA
    # fc1/fc2 in all 10 blocks; attn.qkv/attn.proj in the 8 attention blocks.
    # Dotted names are required: a bare "proj" would also match the Conv2d
    # patch-embedding tokeniser. Never adapted: the spectral complex_weight,
    # attn.to_dynamic_projection, and the patch embedding.
    target_modules: [fc1, fc2, attn.qkv, attn.proj]

    lora_dropout: 0.1
    bias: 'none'
    # task_type: 'SEQ_CLS'

  # metrics for AR segmentation
  select: "bce"
  dice:
    smooth: 1e-5
  iou:
    eps: 1e-6
  bce:
    pos_weight: 1

adapter:
  use_channel_adapter: False
  channels: ['aia94', 'aia131', 'aia171']

optimizer:
  warm_up_steps: 0 #2000
  max_epochs: 15
  learning_rate: 0.001
  min_lr: 0.000001
use_latitude_in_learned_flow: false
loss_weights: [] # [] or list of weights per channel
rollout_steps: 0
num_mask_aia_channels: 0
drop_hmi_probablity: 0.0
validate_after_epoch: 1
wandb_log_train_after: 5 # This should be less than iters_per_epoch_train
wandb_project: "helio-fm" # Typical choices: "helio-fm", "spectformer_with_metrics"
visualization_samples: 3
save_wt_after_iter: 100000
path_experiment: checkpoints
iters_per_epoch_train: 2000
iters_per_epoch_valid: 200
iters_grad_accum: 1
dtype: bfloat16
parallelism: "ddp" # Valid options: "ddp" and "fsdp"

# Finetuning config fields
pretrained_path: ./assets/surya.366m.v1.pt
freeze_backbone: False
